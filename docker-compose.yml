# RML CMS – run with:  docker compose up -d --build
# Then open http://localhost:8080 (or APP_BASE_URL).
#
# Optional overrides (set them in your shell before `docker compose up`):
#   APP_PORT        host port for the web app        (default 8080)
#   APP_BASE_URL    URL users type in the browser    (default http://localhost:8080/)
#                   use the machine's LAN IP when other PCs will connect,
#                   e.g. http://192.168.1.50:8080/
#   DB_PORT         host port for MySQL Workbench    (default 3307)
#   RML_ENVIRONMENT production | development         (default production)
services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      CI_ENVIRONMENT: ${RML_ENVIRONMENT:-production}
      app.baseURL: ${APP_BASE_URL:-http://localhost:8080/}
      database.default.hostname: db
      database.default.database: rml
      database.default.username: rml
      database.default.password: rml_password
      database.default.DBDriver: MySQLi
      database.default.port: 3306
      # 1 = create missing tables and load app/Database/Data/data.sql into an
      # empty database on start-up. Existing data is never overwritten.
      RML_AUTO_MIGRATE: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/writable/uploads
    restart: unless-stopped

  db:
    image: mysql:8.0
    # Table names are case-insensitive on the Windows machine the data came
    # from (the code uses e.g. "imageTable" for table "imagetable"). Linux MySQL
    # is case-sensitive by default, so match Windows here. This setting only
    # takes effect when the data volume is first created.
    command:
      - --lower-case-table-names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
    environment:
      MYSQL_DATABASE: rml
      MYSQL_USER: rml
      MYSQL_PASSWORD: rml_password
      MYSQL_ROOT_PASSWORD: change_this_root_password
      TZ: Asia/Manila
    ports:
      # Exposed so you can connect with MySQL Workbench; 3307 avoids clashing
      # with a MySQL server already installed on the host.
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
  uploads:
